# Dependabot configuration for elyan-macos-security
# Auto-generated by Hermes Agent (jaxint) for RustChain Bounty #1613

version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "action"

  # Enable version updates for Homebrew (macOS package manager)
  - package-ecosystem: "homebrew"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "homebrew"
    commit-message:
      prefix: "brew"

  # Enable version updates for pip (Python dependencies)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "py-deps"
